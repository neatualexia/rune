<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Luna">
  <title>Luna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <div id="toast" class="save-toast">Saved ✓</div>

  <!-- HOME PAGE -->
  <div id="page-home" class="page active">
    <div class="home-header">
      <h1 id="home-date"></h1>
    </div>

    <div class="phase-ring">
      <svg viewBox="0 0 160 160">
        <circle cx="80" cy="80" r="68" fill="none" stroke="#EDE0D9" stroke-width="8"/>
        <circle id="ring-progress" cx="80" cy="80" r="68" fill="none" stroke="#C4687A" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427"
          transform="rotate(-90 80 80)" style="transition:stroke-dashoffset 1s ease"/>
      </svg>
      <div class="phase-label">
        <span class="day-num" id="cycle-day">—</span>
        <span class="day-txt">cycle day</span>
        <span class="phase-name" id="phase-name">Loading…</span>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat-card"><div class="val" id="stat-length">—</div><div class="lbl">Avg cycle</div></div>
      <div class="stat-card"><div class="val" id="stat-period">—</div><div class="lbl">Period len</div></div>
      <div class="stat-card"><div class="val" id="stat-next">—</div><div class="lbl">Days to next</div></div>
    </div>

    <div class="today-section">
      <h3>Today</h3>
      <div id="home-log-area"></div>
      <button class="action-btn secondary" onclick="gotoLog()">Log today →</button>
    </div>
  </div>

  <!-- CALENDAR PAGE -->
  <div id="page-calendar" class="page">
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 id="cal-title">June 2026</h2>
      <button onclick="changeMonth(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--rose)"></div> Period</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--rose-light);border:1px solid var(--rose-mid)"></div> Predicted</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Ovulation</div>
      <div class="legend-item"><div class="legend-dot" style="background:#E8F4EC;border:1px solid #b0d8bc"></div> Fertile</div>
    </div>
  </div>

  <!-- LOG PAGE -->
  <div id="page-log" class="page">
    <div class="log-header">
      <h1>Log</h1>
      <p id="log-date-label">Today</p>
    </div>

    <div class="section-label">Flow</div>
    <div class="flow-row">
      <div class="flow-btn" data-flow="none"   onclick="selectFlow(this)"><span class="flow-dot">○</span>None</div>
      <div class="flow-btn" data-flow="light"  onclick="selectFlow(this)"><span class="flow-dot">◔</span>Light</div>
      <div class="flow-btn" data-flow="medium" onclick="selectFlow(this)"><span class="flow-dot">◑</span>Medium</div>
      <div class="flow-btn" data-flow="heavy"  onclick="selectFlow(this)"><span class="flow-dot">●</span>Heavy</div>
    </div>

    <div class="section-label">Mood</div>
    <div class="mood-row">
      <div class="mood-btn" data-mood="happy"    onclick="selectMood(this)">😊</div>
      <div class="mood-btn" data-mood="calm"     onclick="selectMood(this)">😌</div>
      <div class="mood-btn" data-mood="sad"      onclick="selectMood(this)">😢</div>
      <div class="mood-btn" data-mood="anxious"  onclick="selectMood(this)">😟</div>
      <div class="mood-btn" data-mood="irritable" onclick="selectMood(this)">😤</div>
    </div>

    <div class="section-label">Symptoms</div>
    <div class="chip-grid" id="symptom-chips"></div>

    <div class="section-label">Notes</div>
    <textarea class="note-input" id="log-note" rows="3" placeholder="Anything else to note…"></textarea>

    <button class="action-btn" onclick="saveLog()" style="margin-top:16px">Save log</button>
  </div>

  <!-- CYCLE HISTORY PAGE -->
  <div id="page-history" class="page">
    <div class="history-header">
      <button class="back-btn" onclick="goPage('insights', document.getElementById('nav-insights'))">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="15 18 9 12 15 6"/></svg>
        Insights
      </button>
      <h1>Cycle History</h1>
    </div>
    <div id="history-content"></div>
  </div>

  <!-- INSIGHTS PAGE -->
  <div id="page-insights" class="page">
    <div class="log-header">
      <h1>Insights</h1>
      <p>Your patterns, privately.</p>
    </div>
    <div id="insights-content"></div>

    <div class="section-label">Data</div>
    <button class="action-btn secondary" onclick="exportData()">Export backup</button>
    <button class="action-btn secondary" onclick="importData()">Import backup</button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="active" onclick="goPage('home', this)" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>
      Today
    </button>
    <button onclick="goPage('calendar', this)" id="nav-calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Calendar
    </button>
    <button onclick="goPage('log', this)" id="nav-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Log
    </button>
    <button onclick="goPage('insights', this)" id="nav-insights">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Insights
    </button>
  </nav>

  <!-- JS: load in this order (storage → cycle logic → UI → init) -->
  <script src="js/storage.js"></script>
  <script src="js/cycle.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
